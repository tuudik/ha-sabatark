name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS cannot read files from a private repository, so this job starts once the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-26.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  library:
    runs-on: ubuntu-26.04
    outputs:
      requirement: ${{ steps.source.outputs.requirement }}
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Choose the library source for the manifest's requirement
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          requirement=$(jq -r '.requirements[0]' custom_components/sabatark/manifest.json)
          version=${requirement#sabatark==}
          if curl --fail --silent --output /dev/null "https://pypi.org/pypi/sabatark/$version/json"; then
            source=pypi
          elif gh api repos/tuudik/python-sabatark --silent 2>/dev/null; then
            source=sibling
          else
            source=none
            echo "::notice::Skipping pytest: $requirement is not on PyPI and the python-sabatark repository is not public yet"
          fi
          {
            echo "requirement=$requirement"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"

  pytest:
    needs: library
    if: needs.library.outputs.source != 'none'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ha-sabatark
    steps:
      - uses: actions/checkout@v7
        with:
          path: ha-sabatark
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
          working-directory: ha-sabatark
          activate-environment: true
          enable-cache: true
      - name: Install the pinned test tooling from the dev dependency group
        run: |
          python - <<'PY' > "$RUNNER_TEMP/requirements-dev.txt"
          import tomllib
          group = tomllib.load(open('pyproject.toml', 'rb'))['dependency-groups']['dev']
          print('\n'.join(requirement for requirement in group if requirement != 'sabatark'))
          PY
          uv pip install --requirement "$RUNNER_TEMP/requirements-dev.txt"
      - name: Install the library from PyPI
        if: needs.library.outputs.source == 'pypi'
        env:
          REQUIREMENT: ${{ needs.library.outputs.requirement }}
        run: uv pip install "$REQUIREMENT"
      - name: Check out the sibling library (only until its version is on PyPI)
        if: needs.library.outputs.source == 'sibling'
        uses: actions/checkout@v7
        with:
          repository: tuudik/python-sabatark
          path: python-sabatark
          persist-credentials: false
      - name: Install the sibling library (only until its version is on PyPI)
        if: needs.library.outputs.source == 'sibling'
        run: uv pip install ../python-sabatark
      - name: Verify the installed library version matches the manifest
        env:
          REQUIREMENT: ${{ needs.library.outputs.requirement }}
        run: test "sabatark==$(python -c 'import importlib.metadata; print(importlib.metadata.version("sabatark"))')" = "$REQUIREMENT"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .

  public-safety:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Reject private IPv4 addresses and non-example email addresses
        run: |
          python - <<'PY'
          import ipaddress
          import pathlib
          import re
          import subprocess
          import sys
          networks = [ipaddress.ip_network((value, prefix)) for value, prefix in ((0x0A000000, 8), (0xAC100000, 12), (0xC0A80000, 16))]
          ipv4 = re.compile(r'(?<![\w.])(?:\d{1,3}\.){3}\d{1,3}(?![\w.])')
          email = re.compile(r'[A-Za-z0-9.!#$%&\x27*+/=?^_`{|}~-]+@([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)')
          examples = {'example.com', 'example.net', 'example.org'}
          failed = False
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, paths):
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              payload = path.read_bytes()
              if b'\0' in payload:
                  continue
              for number, line in enumerate(payload.decode('utf-8', errors='replace').splitlines(), 1):
                  for match in ipv4.finditer(line):
                      try:
                          address = ipaddress.ip_address(match.group())
                      except ValueError:
                          continue
                      if any(address in network for network in networks):
                          print(f'{name}:{number}: private IPv4 address')
                          failed = True
                  for match in email.finditer(line):
                      domain = match.group(1).lower()
                      if not any(domain == value or domain.endswith('.' + value) for value in examples):
                          print(f'{name}:{number}: non-example email address')
                          failed = True
          sys.exit(int(failed))
          PY
