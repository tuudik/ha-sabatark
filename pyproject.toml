[project]
name = "ha-sabatark"
version = "0.1.2"
description = "Home Assistant custom integration for Agatark (EnLife) home automation controllers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.372",
    "ruff",
    "sabatark==0.1.0",
]

[tool.uv]
package = false


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
